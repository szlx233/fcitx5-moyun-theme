<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rough" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#C0392B" stroke-linejoin="round">
    <rect x="5.5" y="5.5" width="17" height="17" rx="2" stroke-width="2.2"/>
    <rect x="10.5" y="10.5" width="7" height="7" rx="1" stroke-width="1.6"/>
  </g>
</svg>
